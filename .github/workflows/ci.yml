name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.16.0
  # The browser stack and the integration tests use this server's PostgreSQL.
  DATABASE_URL: postgresql://harvestslot:harvestslot@localhost:5432/harvestslot
  TEST_DATABASE_URL: postgresql://harvestslot:harvestslot@localhost:5432/postgres

jobs:
  checks:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: harvestslot
          POSTGRES_PASSWORD: harvestslot
          POSTGRES_DB: harvestslot
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harvestslot" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations apply to a clean database
        run: pnpm db:migrate
      - run: pnpm test:integration

  e2e:
    name: Production build, browser tests and booking race
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: harvestslot
          POSTGRES_PASSWORD: harvestslot
          POSTGRES_DB: harvestslot
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U harvestslot" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - run: pnpm build
      - run: pnpm --filter @harvestslot/e2e exec playwright install --with-deps chromium
      - name: Browser tests (isolated stack on a fresh _e2e database)
        run: pnpm test:e2e
      - name: Booking race load test
        run: |
          node e2e/stack.mjs > stack.log 2>&1 &
          for i in $(seq 1 120); do curl -fs http://localhost:3000/api/v1/health/ready && break; sleep 1; done
          node tests/load/booking-race.mjs --farmers 20 --slot-kg 5000 --processors 5 --rounds 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            stack.log

  images:
    name: Container images build
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target api -t harvestslot-api:ci .
      - run: docker build --target worker -t harvestslot-worker:ci .
      - run: docker build --target web --build-arg API_INTERNAL_URL=http://api:4000 -t harvestslot-web:ci .
      - name: Compose files are valid
        run: |
          docker compose -f infra/docker-compose.yml --profile apps config -q
          cp infra/production/env.production.example infra/production/.env.production
          docker compose -f infra/production/docker-compose.yml --env-file infra/production/.env.production config -q
